[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "onboarding-flow"
version = "0.1.0"
description = "Encore AI Car Insurance Onboarding FDE Assignment"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Yanai Klugman", email = "me@yanai.sh" }]
dependencies = [
    "granian>=2.8.3",
    "httpx>=0.28.0",
    "litestar>=2.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "container: Docker image smoke tests under tests/integration (see scripts/check-image.sh)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    # Correctness and style baseline
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PIE", "RET", "RSE", "PERF", "FURB",
    "PLE", "PLW", "PTH", "DTZ", "ERA", "T20", "PGH",
    # Exceptions and logging: messages state the rule, never the value (PII in stack traces),
    # log calls pass fields via extra= rather than interpolating them into the message
    "EM", "TRY", "BLE", "LOG", "G",
    # Security and boundaries
    "S", "ASYNC", "SLF", "TID", "INP",
    # Tests
    "PT",
]

[tool.ruff.lint.per-file-ignores]
# assert is the test idiom; integration tests invoke the docker CLI by name on purpose
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["onboarding_flow", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "pydantic.Field",
    "litestar.params.Parameter",
    "litestar.di.Provide",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
