# Build and push the amd64 image on Cloud Build (BuildKit via scripts/docker-build.sh).
# From the repository root:
#   gcloud builds submit --region=us-central1 --config=cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
# _TAG has no default: a fixed tag would be overwritten by every push, and
# Terraform only rolls a new Cloud Run revision when the image reference changes.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ -n "${_TAG}" ]] || { echo 'error: pass --substitutions=_TAG=$$(git rev-parse --short HEAD)' >&2; exit 1; }
        bash scripts/docker-build.sh --push "${_REGION}-docker.pkg.dev/$PROJECT_ID/onboarding-flow/onboarding-flow:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _TAG: ""
