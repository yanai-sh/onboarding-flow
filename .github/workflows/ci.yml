name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - run: uv sync --locked
      - run: bash scripts/check.sh

  image-smoke:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25

    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: docker/setup-buildx-action@v3

      - run: uv sync --locked
      - run: bash scripts/check-image.sh --container-force-build -v
